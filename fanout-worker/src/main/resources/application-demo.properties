# Demo profile (DEV ONLY). Start: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#
# DEV ONLY, NOT AUTH: the caller is taken from two plain headers anyone can set.
#   X-Dev-Firm: firm-demo      (demo firm; another seeded firm is firm-other)
#   X-Dev-User: demo-user
# A production resolver would read validated JWT claims instead.
fanout.web.enabled=true
fanout.status.enabled=true
fanout.capture.enabled=true
fanout.summary.enabled=true
fanout.summary.stub-model=true
fanout.summary.pinned-model=sample-model-2026-01-15
fanout.summary.prompt-version=summary-prompt-v3
# One attempt, so the seeded failing pair dead-letters at once (no clock to wait on).
fanout.summary.max-attempts=1
fanout.web.region=EU
server.port=8080
